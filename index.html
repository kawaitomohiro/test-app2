<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <title>3択クイズ</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="quiz-shell">
      <header class="page-header">
        <p class="eyebrow">CHALLENGE TIME</p>
        <h1>3択クイズ</h1>
        <p class="intro">全100問にチャレンジしよう！</p>
      </header>

      <section class="quiz-card" aria-labelledby="question">
        <div class="quiz-meta">
          <p id="progress" class="progress">第1問 / 100問</p>
          <p id="score" class="score">得点 <span>0</span></p>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div id="progress-bar" class="progress-bar"></div>
        </div>

        <h2 id="question" class="question"></h2>
        <div id="choices" class="choices" aria-label="選択肢"></div>
        <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
        <button id="next-button" class="next-button" type="button" hidden>次の問題</button>

        <div id="result" class="result" hidden>
          <p class="result-label">QUIZ COMPLETE</p>
          <h2>おつかれさま！</h2>
          <p id="final-score" class="final-score"></p>
          <p id="result-message" class="result-message"></p>
          <button id="restart-button" class="next-button" type="button">もう一度挑戦する</button>
        </div>
      </section>
      <footer>自分のペースで考えてみよう</footer>
    </main>
  </body>
</html>
